<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #333333;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      .card {
        background: #ffffff;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .header {
        text-align: center;
        margin-bottom: 24px;
      }
      .logo {
        font-size: 24px;
        font-weight: 700;
        color: #6366f1;
      }
      h1,
      h2,
      h3 {
        color: #111827;
        margin-top: 0;
      }
      p {
        margin: 16px 0;
        color: #4b5563;
      }
      .cta-button {
        display: inline-block;
        padding: 14px 28px;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 16px;
        margin: 24px 0;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      }
      .cta-button:hover {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      }
      .highlight-box {
        background: #f0f9ff;
        border: 1px solid #0ea5e9;
        border-radius: 8px;
        padding: 20px;
        margin: 24px 0;
        text-align: center;
      }
      .highlight-box h2 {
        margin: 0;
        color: #0369a1;
      }
      .tips-box {
        background: #f9fafb;
        border-radius: 8px;
        padding: 20px;
        margin: 24px 0;
      }
      .tips-box ul {
        margin: 12px 0 0 0;
        padding-left: 20px;
      }
      .tips-box li {
        margin: 8px 0;
        color: #4b5563;
      }
      .footer {
        text-align: center;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid #e5e7eb;
        font-size: 14px;
        color: #9ca3af;
      }
      .footer a {
        color: #6366f1;
        text-decoration: none;
      }
      .unsubscribe {
        font-size: 12px;
        color: #9ca3af;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header">
          <div class="logo">🚀 Hire-X</div>
        </div>

        {% block content %}{% endblock %}

        <div class="footer">
          <p>Sent with ❤️ by Hire-X</p>
          <p class="unsubscribe">
            If you're not interested, no worries at all - just ignore this
            email.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
