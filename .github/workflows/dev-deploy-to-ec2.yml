name: Deploy to EC2 on Dev Merge

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2 with PM2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/hire-X/backend-mvp

            echo "Pulling latest code..."
            git pull origin dev

            echo "Activating virtual environment..."
            source venv/bin/activate

            echo "Installing dependencies..."
            pip install -r requirements.txt

            echo "Restarting backend with PM2..."
            pm2 stop hirex-backend || true
            pm2 delete hirex-backend || true
            pm2 start python3 --name hirex-backend -- main.py

            echo "Saving PM2 process list..."
            pm2 save

            echo "Deployment complete!"
          EOF

