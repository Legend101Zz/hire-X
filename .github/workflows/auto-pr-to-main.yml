name: Auto PR from dev to main

on:
  push:
    tags:
      - "ready-for-prod-*" # Triggers when you push a tag like ready-for-prod-v1.0

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get tag name
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: repo-sync/pull-request@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: dev
          destination_branch: main
          pr_title: "🚀 Production Release: ${{ steps.tag.outputs.tag_name }}"
          pr_body: |
            ## 🎉 Ready for Production

            This PR was automatically created from the `dev` branch after tagging with `${{ steps.tag.outputs.tag_name }}`.

            ### 📋 Checklist
            - [ ] All tests passing
            - [ ] Code reviewed
            - [ ] Documentation updated
            - [ ] Ready for production deployment

            ### 🔖 Tag Information
            **Tag:** `${{ steps.tag.outputs.tag_name }}`
            **Branch:** `dev`

            ---
            *This PR was automatically created by GitHub Actions*
          pr_label: "production,automated-pr"
