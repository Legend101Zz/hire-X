version: 1.0
runtime: python3
build:
  commands:
    pre-build:
      - echo "Installing dependencies..."
    build:
      - pip install -r requirements.txt
    post-build:
      - echo "Build completed"
run:
  runtime-version: 3.11
  command: python main.py
  network:
    port: 8080
    env: PORT
  env:
    - name: PORT
      value: "8080"

